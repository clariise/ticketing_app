<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticketing Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Ticketing Dashboard</h1>
  </header>

  <main class="container">
    <!-- Category tabs -->
    <nav id="type-tabs" class="tabs"></nav>

    <!-- Summary cards -->
    <section id="summary" class="summary"></section>

    <!-- Create ticket form -->
    <section class="panel">
      <h2>Create Ticket</h2>
      <form id="ticket-form" class="form-grid">
        <select id="f-type" required>
          <option value="Incident">Incident</option>
          <option value="Work">Work</option>
          <option value="Deployment">Deployment</option>
          <option value="Test">Test</option>
          <option value="Service Request">Service Request</option>
        </select>

        <input type="text" id="f-title" placeholder="Short summary" required>

        <select id="f-priority">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
          <option>Critical</option>
        </select>

        <select id="f-status">
          <option selected>Open</option>
          <option>In Progress</option>
          <option>Resolved</option>
        </select>

        <input type="text" id="f-assignee" placeholder="Assignee">
        <label class="field">
        <span>Created date</span>
        <input type="date" id="f-created" required>
        </label>

        <button type="submit">Add Ticket</button>
      </form>
    </section>

    <!-- Ticket table -->
    <section class="panel">
      <div class="table-header">
        <h2>Tickets</h2>
        <div class="filters">
          <input type="text" id="search" placeholder="Search title or assignee">
          <select id="filter-status">
            <option value="All">All statuses</option>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Title</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Assignee</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ticket-body"></tbody>
        </table>
        <p id="empty-msg" class="empty" hidden>No tickets match your filters.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
